# Production-like stack: docker compose up --build
# Dev with hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
    mongo:
        image: mongo:7
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: unless-stopped

    server:
        build: ./server
        environment:
            JWT_SECRET: ${JWT_SECRET:?run ./scripts/setup-env.sh}
            MONGODB_URI: mongodb://mongo:27017/rankpilot
            BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:?set it in .env}
            GEMINI_API_KEY: ${GEMINI_API_KEY:?set it in .env}
            GEMINI_MODEL: ${GEMINI_MODEL:-gemma-4-31b-it}
            PORT: 5000
            CORS_ORIGIN: http://localhost:${CLIENT_PORT:-8080},http://localhost:5173
            APP_URL: http://localhost:${CLIENT_PORT:-8080}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            EMAIL_FROM: ${EMAIL_FROM:-RankPilot <alerts@example.com>}
        ports:
            - "${SERVER_PORT:-5050}:5000"
        depends_on:
            mongo:
                condition: service_healthy
        restart: unless-stopped

    client:
        build:
            context: ./client
            args:
                VITE_BACKEND_URL: http://localhost:${SERVER_PORT:-5050}
        ports:
            - "${CLIENT_PORT:-8080}:80"
        depends_on:
            - server
        restart: unless-stopped

volumes:
    mongo-data:
